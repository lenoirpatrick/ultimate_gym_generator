# =============================================================================
# Pile complète : application, base SQLite persistée sur volume.
#
#   cp .env.example .env      puis renseigner les valeurs obligatoires
#   docker compose up -d --build
#   docker compose run --rm web python manage.py createsuperuser
#   → http://localhost:5907
# =============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: plenoir/ultimate-gym-generator:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_PORT: "5907"
      # Chemin monté sur le volume ci-dessous : la base survit à toute
      # reconstruction de l'image.
      DJANGO_DB_PATH: /app/data/db.sqlite3
    ports:
      - "${DJANGO_PORT:-5907}:5907"
    volumes:
      - db_data:/app/data
      # Persistance des fichiers déposés par les utilisateurs.
      - media_data:/app/media

volumes:
  db_data:
  media_data:
