name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Une exécution par branche : un nouveau push annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  # Les secrets ne sont pas lisibles dans un `if:` de job. Ce job les traduit en
  # sorties booléennes pour que la CI reste verte tant qu'ils ne sont pas créés.
  secrets-gate:
    name: Secrets disponibles
    runs-on: ubuntu-latest
    outputs:
      sonar: ${{ steps.check.outputs.sonar }}
    steps:
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "sonar=true" >> "$GITHUB_OUTPUT"
          else
            echo "sonar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN absent — l'analyse SonarCloud est ignorée."
          fi

  lint:
    name: Style et qualité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Installer ruff
        run: pip install "ruff>=0.9"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests et couverture
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Installer les dépendances
        run: pip install -r requirements/dev.txt

      - name: Vérifier qu'aucune migration ne manque
        run: python manage.py makemigrations --check --dry-run

      - name: Contrôler la configuration
        run: python manage.py check

      - name: Exécuter les tests
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Conserver le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  sonar:
    name: Analyse SonarCloud
    runs-on: ubuntu-latest
    needs: [secrets-gate, test]
    if: needs.secrets-gate.outputs.sonar == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : Sonar en a besoin pour attribuer les lignes
          # (« new code ») et dater les problèmes.
          fetch-depth: 0

      - name: Récupérer le rapport de couverture
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Analyser
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Construction de l'image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ultimate-gym-generator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérifier que le conteneur démarre
        run: |
          docker run --rm ultimate-gym-generator:ci \
            python -c "import django; print('Django', django.get_version())"
          # L'utilisateur doit être non-root.
          test "$(docker image inspect ultimate-gym-generator:ci --format '{{.Config.User}}')" = "gym"
