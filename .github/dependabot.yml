version: 2

updates:
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Une seule PR pour les correctifs : évite le bruit hebdomadaire.
      correctifs:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
