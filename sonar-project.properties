sonar.projectKey=lenoirpatrick_ultimate_gym_generator
sonar.organization=lenoirpatrick
sonar.projectName=Ultimate Gym Generator

sonar.sources=accounts,aiproviders,config,core
sonar.tests=tests

# Code généré ou non pertinent pour l'analyse.
sonar.exclusions=**/migrations/**,**/static/**,staticfiles/**,assets/**,.venv/**

# Les tests sont analysés, mais ne comptent pas dans la couverture ni la dette.
sonar.coverage.exclusions=tests/**,**/migrations/**,**/wsgi.py,**/asgi.py,manage.py

sonar.python.version=3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
