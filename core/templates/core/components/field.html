{% comment %}
Champ de formulaire : libellé, contrôle, aide, erreurs.
Usage : {% include "core/components/field.html" with field=form.secret %}
{% endcomment %}
<div class="ugg-field">
    <label class="ugg-field__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    <div class="ugg-field__control">{{ field }}</div>
    {% if field.help_text %}
        <p class="ugg-field__help">{{ field.help_text }}</p>
    {% endif %}
    {% for error in field.errors %}
        <p class="ugg-field__error">{{ error }}</p>
    {% endfor %}
</div>
